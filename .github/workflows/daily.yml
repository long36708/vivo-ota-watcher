name: Vivo OTA Daily Check

on:
  schedule:
    # 每天北京时间 09:00（UTC+8 = 01:00 UTC）
    - cron: '0 1 * * *'
  workflow_dispatch: {}   # 支持手动触发测试

permissions:
  contents: write        # 写回 results/
  issues: write          # 开启通知 Issue

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 源码编译 unidbg 首次较慢，给足时间
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt

      # 缓存 maven 仓库，避免每次重新下载依赖（unidbg install 仍会编译，但依赖已就绪）
      - name: Cache Maven ~/.m2
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('run_source.py') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # 源码编译 unidbg（对齐官方 README）：
      #   clone unidbg@V0.9.9 -> 编译出正确的 libunicorn_java.so/libunicorn.so
      #   (坏 jar 内的 Linux native 缺 13 个 TCG helper 符号，系统库也无法提供，
      #    只能由 unidbg 源码编译时正确生成)
      - name: Build unidbg from source
        run: python run_source.py build

      # 验证阶段：先跑通一个机型，确认 native 加载链路正常。
      # 后续会在此接入 models.json 全量批处理 + 结果比较/通知。
      - name: Run single model (verify)
        continue-on-error: true
        run: |
          python run_source.py run $(python -c "import json;print(list(json.load(open('models.json')).keys())[0])")

      # 全部机型（验证通过后启用）
      # - name: Run all models
      #   continue-on-error: true
      #   run: python run_source.py run-all
