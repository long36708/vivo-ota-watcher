name: Vivo OTA Daily Check

on:
  schedule:
    # 每天北京时间 09:00（UTC+8 = 01:00 UTC）
    - cron: '0 1 * * *'
  workflow_dispatch: {}   # 支持手动触发测试

permissions:
  contents: write        # 提交 results/ 回仓库
  issues: write          # 发现新版本时创建/更新通知 Issue

concurrency:
  group: ota-daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt

      # 纯 Python 方案：AES 加密已静态实现（密钥自 libvivoseckey.so 逆向提取），
      # 无需 JDK / unidbg / Maven。查询引擎见 vivo_ota_tracker.py。
      - name: Run OTA check
        id: check
        run: python run_check.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "chore: update OTA check results $(date +%F)"
            git push
          fi

      - name: Report new versions via Issue
        if: always() && steps.check.outputs.has_new_versions == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="vivo OTA 新版本汇总"
          NUMBER=$(gh issue list --state all --search "in:title $TITLE" --limit 1 --json number --jq '.[0].number // empty')
          TODAY=$(date +%F)
          if [ -n "$NUMBER" ]; then
            gh issue reopen "$NUMBER" 2>/dev/null || true
            if ! gh issue view "$NUMBER" --json comments --jq '.comments[].body' | grep -qF "报告日期：$TODAY"; then
              gh issue comment "$NUMBER" --body-file issue_body.md
            fi
          else
            gh issue create --title "$TITLE" --body-file issue_body.md
          fi
