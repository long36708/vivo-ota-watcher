name: Vivo OTA Daily Check

on:
  schedule:
    # 每天北京时间 09:00（UTC+8 = 01:00 UTC）
    - cron: '0 1 * * *'
  workflow_dispatch: {}   # 支持手动触发测试

permissions:
  contents: write        # 写回 results/
  issues: write          # 开启通知 Issue

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt

      # jar 内 natives/linux_64/libunicorn_java.so 是纯 JNI 薄壳，
      # 它引用的 13 个 TCG 符号(helper_div_i32 等)在同目录 libunicorn.so 中
      # 并不存在（上游打包的两个 .so 版本不匹配），因此必须用系统 unicorn 提供。
      # Windows 侧的 unicorn_java.dll 是自包含构建，所以本地不受影响。
      - name: Install system unicorn
        run: |
          sudo apt-get update
          sudo apt-get install -y libunicorn2 libunicorn-dev || \
            sudo apt-get install -y libunicorn1 libunicorn-dev
          echo "--- 已安装的 unicorn 库 ---"
          ldconfig -p | grep -i unicorn || true

      - name: Run OTA check
        id: check
        continue-on-error: true
        run: |
          python run_check.py || echo "EXIT_CODE=$?" >> "$GITHUB_ENV"

      - name: Report failures (if any)
        if: env.EXIT_CODE == '3' || env.EXIT_CODE == '4'
        run: |
          echo "::warning::部分机型查询失败（退出码 ${{ env.EXIT_CODE }}）。详见 results/ 中 status=error 的记录。"
          echo "失败机型已写入对应 results/<model>.json，不影响其他机型。"

      - name: Commit results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "chore: update OTA check results $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open Issue on new version
        if: env.EXIT_CODE == '2' || env.EXIT_CODE == '3'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('new_versions.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🆕 Vivo OTA 新版本可用 (${new Date().toISOString().slice(0,10)})`,
              body: "检测到以下机型有新升级包：\n\n```\n" + body + "```"
            });
